<style>
:root{--navy:#283862;--navy2:#1E2B4D;--cream:#F6F0E6;--paper:#FFFBF5;--rose:#D98A9C;--roseDeep:#B4566E;--roseSoft:#F3D6DD;--muted:#5B6787;--line:#E4DACB;--ok:#2F7962;--okSoft:#E3F1EA;--bad:#B4566E;--badSoft:#F8E3E8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--navy);font-family:Quicksand,sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 32px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px}
.brand b{font-size:28px;font-weight:700;letter-spacing:.5px}
.brand span{font-size:13px;font-weight:600;letter-spacing:4px;color:var(--rose)}
.tabs{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px}
.tabs button{border:0;background:transparent;font-size:18px;font-weight:600;color:var(--muted);padding:12px 26px;border-radius:999px;min-height:48px}
.tabs button[aria-selected=true]{background:var(--navy);color:var(--cream)}
main{flex:1;display:flex;padding:0 32px 32px}
.panel{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:48px;display:flex;flex-direction:column;min-height:640px}
.it{font-family:Lora,serif;font-style:italic;color:var(--rose);font-weight:400}
.kick{font-size:14px;font-weight:700;letter-spacing:5px;color:var(--rose)}
h1{font-size:56px;line-height:1.05;margin:14px 0 0;font-weight:700}
h2{font-size:40px;line-height:1.15;margin:10px 0 0;font-weight:700}
p.lead{font-size:22px;line-height:1.5;color:var(--muted);max-width:720px;margin:20px 0 0}
.btn{border:0;border-radius:18px;font-size:22px;font-weight:700;padding:20px 36px;min-height:64px;background:var(--navy);color:var(--cream)}
.btn.rose{background:var(--rose);color:var(--navy2)}
.btn.ghost{background:transparent;color:var(--navy);border:2px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.prize{display:inline-flex;align-items:center;gap:12px;background:var(--roseSoft);color:var(--navy);border-radius:999px;padding:12px 22px;font-size:18px;font-weight:600;margin-top:28px}
.prog{display:flex;gap:8px;margin-bottom:28px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--navy)}
.qnum{font-size:15px;font-weight:700;letter-spacing:4px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:36px}
.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:20px;padding:22px 24px;font-size:22px;font-weight:600;color:var(--navy);min-height:84px;display:flex;align-items:center;gap:16px}
.opt .l{flex:none;width:38px;height:38px;border-radius:12px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--okSoft)}
.opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badSoft)}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.45}
.fb{margin-top:28px;border-radius:20px;padding:22px 26px;background:var(--cream);font-size:20px;line-height:1.5;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.fb strong{display:block;font-size:22px;margin-bottom:4px}
.fb .src{font-size:14px;color:var(--muted);margin-top:6px}
.big{font-size:150px;font-weight:700;line-height:1}
form{width:100%;max-width:560px;text-align:left;display:flex;flex-direction:column;gap:18px;margin-top:32px}
label.f{display:flex;flex-direction:column;gap:8px;font-size:17px;font-weight:600;color:var(--muted)}
input[type=text],input[type=tel],input[type=password]{font-family:inherit;font-size:24px;font-weight:600;color:var(--navy);padding:18px 20px;border:2px solid var(--line);border-radius:16px;background:#fff;min-height:64px}
input:focus{outline:none;border-color:var(--navy)}
.check{display:flex;gap:14px;align-items:flex-start;font-size:17px;line-height:1.45;color:var(--muted)}
.check input{width:28px;height:28px;flex:none;margin:0;accent-color:var(--navy)}
.err{color:var(--bad);font-size:16px;font-weight:600;min-height:20px}
/* score */
.layers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:36px}
.layer{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px}
.layer .n{width:44px;height:44px;border-radius:14px;background:var(--navy);color:var(--cream);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
.layer h3{font-size:24px;margin:18px 0 8px}
.layer p{font-size:17px;line-height:1.5;color:var(--muted);margin:0}
.layer ul{margin:12px 0 0;padding-left:20px;font-size:16px;line-height:1.6;color:var(--navy)}
.note{margin-top:24px;background:var(--cream);border-radius:20px;padding:22px 26px;font-size:18px;line-height:1.55}
.soon{margin-top:36px;border:2px dashed var(--line);border-radius:22px;padding:40px;text-align:center;color:var(--muted);font-size:20px}
/* equipe */
.teamlink{position:fixed;right:14px;bottom:10px;border:0;background:transparent;color:#B9AF9F;font-size:13px;font-weight:600;padding:10px;min-height:44px}
.overlay{position:fixed;inset:0;background:rgba(30,43,77,.55);display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}
.modal{background:var(--paper);border-radius:28px;padding:36px;width:min(760px,100%);max-height:90vh;overflow:auto}
.daypick{display:flex;gap:10px;margin:18px 0}
.daypick button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 20px;font-size:17px;font-weight:700;color:var(--navy);min-height:48px}
.daypick button[aria-pressed=true]{background:var(--navy);color:var(--cream);border-color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:16px;margin-top:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}

  ],
  sabado: [
    {q:'Quantas mulheres sofreram assédio físico em ônibus ou metrô no último ano?', o:['Cerca de 800 mil','Cerca de 2 milhões','Cerca de 8 milhões','Cerca de 30 milhões'], a:2,
     e:'15,3% das brasileiras, cerca de 8 milhões de mulheres, sofreram assédio físico no transporte público.', s:'FBSP/Datafolha, Visível e Invisível (2025)'},
    {q:'Em uma emergência, qual número chama a Polícia Militar?', o:['180','190','192','199'], a:1,
     e:'190 é a Polícia Militar. O 180 é a Central de Atendimento à Mulher, para denúncias e orientação.'},
    {q:'Quem o Ampara avisa quando você precisa de ajuda?', o:['Ninguém','Sua rede de apoio, que você mesma escolhe','Pessoas aleatórias por perto','Só a faculdade'], a:1,
     e:'Você cadastra seus contatos de emergência, e são eles que recebem o alerta com a sua localização.'},
    {q:'No Ampara, o que são os "locais seguros"?', o:['Delegacias','Lugares que você cadastra, como casa e trabalho','Shoppings','Pontos de ônibus'], a:1,
     e:'Você marca os lugares onde se sente segura, e o Ampara leva isso em conta ao avaliar a situação.'},

     e:'57% das violências relatadas aconteceram em casa. Na rua, o mais comum é o assédio: 40,8% ouviram cantadas e comentários desrespeitosos.', s:'FBSP/Datafolha, Visível e Invisível (2025)'},

     e:'No moderado, ele passa a registrar sua posição com mais frequência, sem incomodar. O alerta com a pergunta "Está tudo bem?" fica para o nível alto.'},

const DAY_LABEL = {sexta:'Sexta (23/10)', sabado:'Sábado (24/10)'};

function defaultDay(){
  try{ const s=localStorage.getItem('ampara-quiz-dia'); if(s&&QUIZZES[s]) return s }catch(e){}
  const d=new Date(); return (d.getMonth()===9 && d.getDate()===24) ? 'sabado' : 'sexta';
}
const state = { tab:'score', day: defaultDay(), step:'start', i:0, picked:null, hits:0, saving:false, err:'' };
let resetTimer = null;
const SB_URL='https://hhlxgtwvoxpvyvejvxwt.supabase.co', SB_KEY='sb_publishable_LaG0x6zbfn3HTGFbDE4Lgg_F6bROg8g';
const sb = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,storageKey:'ampara-eureka-auth'}}) : null;
const FILA='ampara_eureka_fila';
function lerFila(){try{return JSON.parse(localStorage.getItem(FILA)||'[]')}catch(e){return []}}
function gravarFila(f){try{localStorage.setItem(FILA,JSON.stringify(f))}catch(e){}}
async function enviar(row){ if(!sb) throw {offline:true};
  const {error}=await sb.from('eureka_participantes').insert(row);
  if(error && error.code!=='23505'){ if(!error.code||/fetch|network/i.test(error.message||'')) throw {offline:true}; throw error }
}
async function esvaziarFila(){ const f=lerFila(); if(!f.length) return; const resto=[];
  for(const r of f){ try{ await enviar(r) }catch(e){ resto.push(r) } } gravarFila(resto) }
window.addEventListener('online',esvaziarFila); setTimeout(esvaziarFila,1500); setInterval(esvaziarFila,60000);
const db = {
  collection(n){ const dia=n.replace('participantes_','');
    return {
      doc(id){ return { async set(o){ const row={dia,nome:o.nome,telefone:id.replace(/^t/,''),acertos:o.acertos,total:o.total,consentimento:true};
        try{ await enviar(row) }catch(e){ if(e&&e.offline){ const f=lerFila(); f.push(row); gravarFila(f); return } throw e } } } },
      orderBy(){ return { onSnapshot(cb,err){ let vivo=true;
        const run=async()=>{ if(!sb||!vivo) return; const c=credenciais(); if(!c){ err&&err({message:'Sessão expirada. Entre de novo.'}); return } const {data,error}=await sb.rpc('eureka_listar',{p_usuario:c.u,p_senha:c.p,p_dia:dia});
          if(!vivo) return; if(error){ err&&err(error); return } cb({docs:(data||[]).map(r=>({data:()=>({nome:r.nome,telefone:fmtPhone(r.telefone),acertos:r.acertos,total:r.total,criadoEm:r.criado_em})}))}) };
        run(); const t=setInterval(run,8000); window.addEventListener('ampara-change',run);
        return ()=>{ vivo=false; clearInterval(t); window.removeEventListener('ampara-change',run) } } } }
    } },
  async clear(n){ if(!sb) return; const c=credenciais(); if(!c) return; const {error}=await sb.rpc('eureka_apagar',{p_usuario:c.u,p_senha:c.p,p_dia:n.replace('participantes_','')}); if(error) alertaEquipe('Não foi possível apagar: '+error.message); window.dispatchEvent(new Event('ampara-change')) }
};
function alertaEquipe(m){ const e=document.getElementById('teamErr'); if(e) e.textContent=m }

const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtPhone(v){const d=v.replace(/\D/g,'').slice(0,11);if(d.length<=2)return d.length?'('+d:'';if(d.length<=7)return '('+d.slice(0,2)+') '+d.slice(2);return '('+d.slice(0,2)+') '+d.slice(2,d.length-4)+'-'+d.slice(-4)}

function render(){
  $('#tab-quiz').setAttribute('aria-selected', state.tab==='quiz');
  $('#tab-score').setAttribute('aria-selected', state.tab==='score');
  const v = $('#view');
  if(state.tab==='score'){ v.innerHTML = scoreHTML(); renderMatrix(); return }
  const qs = QUIZZES[state.day];
  if(state.step==='start'){
    v.innerHTML = `<div class="center">
      <div class="kick">QUIZ AMPARA · ${esc(DAY_LABEL[state.day].toUpperCase())}</div>
      <h1>Responda 10 perguntas<br><span class="it">e concorra</span></h1>
      <div class="prize"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 11v2M7 10l-2 4h4l-2 4"/></svg>Sorteio de um power bank no fim do dia</div>
      <p class="lead" style="text-align:center">Leva uns 3 minutos. Ao final, deixe seu nome e telefone para participar.</p>
      <button class="btn" style="margin-top:40px" id="go">Começar</button></div>`;
    $('#go').onclick=()=>{Object.assign(state,{step:'q',i:0,picked:null,hits:0});render()};
    return;
  }
  if(state.step==='q'){
    const q = qs[state.i]; const answered = state.picked!==null;
    v.innerHTML = `<div class="prog">${qs.map((_,k)=>`<i class="${k<=state.i?'on':''}"></i>`).join('')}</div>
      <div class="qnum">PERGUNTA ${state.i+1} DE ${qs.length}</div>
      <h2>${esc(q.q)}</h2>
      <div class="opts">${q.o.map((t,k)=>{let c='opt';if(answered){if(k===q.a)c+=' right';else if(k===state.picked)c+=' wrong';else c+=' dim'}
        return `<button class="${c}" data-k="${k}" ${answered?'disabled':''}><span class="l">${'ABCD'[k]}</span>${esc(t)}</button>`}).join('')}</div>
      ${answered?`<div class="fb"><div style="flex:1;min-width:280px"><strong>${state.picked===q.a?'Acertou!':'Quase!'}</strong>${esc(q.e)}${q.s?`<div class="src">Fonte: ${esc(q.s)}</div>`:''}</div>
        <button class="btn" id="next">${state.i<qs.length-1?'Próxima':'Ver resultado'}</button></div>`:''}`;
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;state.picked=k;if(k===q.a)state.hits++;render()});
    if(answered) $('#next').onclick=()=>{if(state.i<qs.length-1){state.i++;state.picked=null}else state.step='form';render()};
    return;
  }
  if(state.step==='form'){
    v.innerHTML = `<div class="center">
      <div class="kick">SEU RESULTADO</div>
      <div class="big">${state.hits}<span class="it" style="font-size:64px">/${qs.length}</span></div>
      <p class="lead" style="text-align:center;margin-top:8px">${state.hits===qs.length?'Gabaritou! ':''}Agora deixe seus dados para concorrer ao power bank.</p>
      <form id="f" autocomplete="off">
        <label class="f">Nome<input type="text" id="nome" maxlength="80" required></label>
        <label class="f">Telefone (WhatsApp)<input type="tel" id="tel" inputmode="numeric" placeholder="(11) 91234-5678" required></label>
        <label class="check"><input type="checkbox" id="ok"> Autorizo o uso do meu nome e telefone apenas para o sorteio do Ampara na Eureka 2026. Os dados não serão compartilhados e serão apagados depois do sorteio.</label>
        <div class="err" id="err">${esc(state.err)}</div>
        <div style="display:flex;gap:14px;flex-wrap:wrap"><button class="btn" type="submit" ${state.saving||!db?'disabled':''}>${state.saving?'Salvando...':'Participar do sorteio'}</button>
        <button class="btn ghost" type="button" id="skip">Não quero participar</button></div>
        
      </form></div>`;
    const tel=$('#tel'); tel.oninput=()=>{tel.value=fmtPhone(tel.value)};
    $('#skip').onclick=()=>{Object.assign(state,{step:'start',err:''});render()};
    $('#f').onsubmit=async ev=>{
      ev.preventDefault();
      const nome=$('#nome').value.trim(), digits=tel.value.replace(/\D/g,'');
      if(nome.length<2){state.err='Digite seu nome.';$('#err').textContent=state.err;return}
      if(digits.length<10){state.err='Digite um telefone com DDD.';$('#err').textContent=state.err;return}
      if(!$('#ok').checked){state.err='Marque a autorização para participar.';$('#err').textContent=state.err;return}
      if(!db) return;
      state.saving=true; state.err=''; const n=nome; render();
      try{
        await db.collection('participantes_'+state.day).doc('t'+digits).set({nome:n,telefone:fmtPhone(digits),acertos:state.hits,total:qs.length,criadoEm:new Date().toISOString()});
        state.saving=false; state.step='done'; render();
      }catch(e){ state.saving=false; state.err= e&&e.code==='quota_exceeded' ? 'A lista está cheia. Chame alguém da equipe.' : 'Não conseguimos salvar. Tente de novo ou chame alguém da equipe.'; render() }
    };
    return;
  }
  if(state.step==='done'){
    v.innerHTML = `<div class="center">
      <div class="kick">TUDO CERTO</div>
      <h1>Você está<br><span class="it">participando!</span></h1>
      <p class="lead" style="text-align:center">O sorteio do power bank acontece no fim do dia, aqui no Stand 72. Se for você, a gente avisa pelo telefone.</p>
      <p class="it" style="font-size:28px;margin-top:36px;color:var(--navy)">Tecnologia que percebe. Proteção que acompanha.</p>
      <button class="btn ghost" style="margin-top:28px" id="again">Próxima pessoa</button></div>`;
    $('#again').onclick=()=>{clearTimeout(resetTimer);Object.assign(state,{step:'start'});render()};
    clearTimeout(resetTimer); resetTimer=setTimeout(()=>{if(state.step==='done'){state.step='start';render()}},15000);
  }
}

function scoreHTML(){
  return SCORE_HTML;
}
const SCORE_HTML = `<div class="kick">PARA QUEM QUER ENTENDER POR DENTRO</div>
<h1>Como o score <span class="it">funciona</span></h1>
<p class="lead">Um sistema híbrido em três camadas: o contexto do lugar, os sinais do corpo e uma fusão por regra explícita. Só o movimento do celular usa aprendizado de máquina.</p>
<div class="layers">
<div class="layer"><div class="n">1</div><h3>Contexto</h3><p>Onde e quando você está. Estatística descritiva.</p>
<ul><li>Mapa da SSP-SP por município × bairro × período (madrugada, manhã, tarde, noite)</li><li>Faixa baixo, médio ou alto pelos percentis 33 e 66</li><li>Bairro sem dados: usa a estimativa da cidade; sem nenhuma, "indisponível"</li><li>Em local seguro cadastrado (80 m), o contexto é baixo</li></ul></div>
<div class="layer"><div class="n">2</div><h3>Corpo</h3><p>Se algo foge do <b>seu</b> normal.</p>
<ul><li><b>Batimentos (60%):</b> z-score contra a sua última hora</li><li><b>Movimento do celular (20%):</b> Isolation Forest sobre janelas de 2,56 s do acelerômetro</li><li><b>Movimento do relógio (20%):</b> regra com limites próprios do pulso</li><li>Faltou um sinal: os pesos se redistribuem, nada é inventado</li><li>Modo atividade: o movimento vale metade</li></ul></div>
<div class="layer"><div class="n">3</div><h3>Fusão</h3><p>Uma matriz 3×3 explícita, da orientação do TCC.</p>
<ul><li>Regras fixas e auditáveis, sem "caixa-preta"</li><li>O nível só sobe depois de 5 s seguidos e só desce depois de 10 s estável</li><li>Sem uma camada, não há nível: "calculando" ou "sem dados da região", nunca "seguro"</li></ul></div>
</div>
<div style="display:flex;gap:28px;flex-wrap:wrap;margin-top:36px;align-items:stretch">
<div style="flex:1 1 520px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px">
<div class="kick">TESTE A MATRIZ</div>
<div id="mx"></div>
</div>
<div style="flex:1 1 320px;display:flex;flex-direction:column;gap:16px">
<div class="note"><b>Corroboração.</b> Sem relógio (iPhone ou Android sem relógio), o corpo nunca passa de médio, e só chega a médio com movimento atípico mantido por 10 s. Com relógio, "alto" precisa da confirmação do batimento ou do movimento do pulso.</div>
<div class="note"><b>Sempre pergunta antes.</b> Em nível alto, abre uma contagem de 10 s: "Está tudo bem?". Sem resposta, a rede de apoio recebe o alerta com a localização. O SOS manual (segurar 3 s) é imediato.</div>
<div class="note"><b>Teste do modelo.</b> Isolation Forest treinado com atividades cotidianas da base pública UCI HAR. Numa simulação de 32,9 min de caminhada com o fluxo completo do app: 0 alertas falsos, mesmo em contexto alto. É uma simulação, não uma validação com pessoas.</div>
</div></div>`;
const MATRIX = {baixo:{baixo:'baixo',medio:'baixo',alto:'moderado'},medio:{baixo:'baixo',medio:'moderado',alto:'alto'},alto:{baixo:'moderado',medio:'alto',alto:'alto'}};
const LV = {baixo:'Baixo',medio:'Médio',alto:'Alto'};
const OUT = {baixo:['Baixo','Segue acompanhando, sem nenhuma ação.','#E3F1EA','#2F7962'],moderado:['Moderado','Monitoramento reforçado em silêncio: grava a posição a cada minuto, sem alerta.','#FFF2DF','#8A4F00'],alto:['Alto','Depois de 5 s em alto, abre a contagem de 10 s "Está tudo bem?". Sem resposta, avisa a rede de apoio.','#F8E3E8','#9E3F57']};
let mxC='medio', mxB='alto';
function renderMatrix(){
  const el=document.getElementById('mx'); if(!el) return;
  const r=MATRIX[mxC][mxB]; const o=OUT[r];
  const pick=(name,cur)=>Object.keys(LV).map(k=>`<button data-${name}="${k}" aria-pressed="${cur===k}" style="border:2px solid ${cur===k?'var(--navy)':'var(--line)'};background:${cur===k?'var(--navy)':'#fff'};color:${cur===k?'var(--cream)':'var(--navy)'};border-radius:14px;padding:12px 18px;font-size:18px;font-weight:700;min-height:48px;min-width:96px">${LV[k]}</button>`).join('');
  el.innerHTML=`<div style="display:grid;grid-template-columns:120px 1fr;gap:14px 16px;align-items:center;margin-top:18px">
  <div style="font-weight:700;font-size:17px">Contexto</div><div style="display:flex;gap:10px;flex-wrap:wrap">${pick('c',mxC)}</div>
  <div style="font-weight:700;font-size:17px">Corpo</div><div style="display:flex;gap:10px;flex-wrap:wrap">${pick('b',mxB)}</div></div>
  <div style="margin-top:22px;border-radius:18px;padding:22px;background:${o[2]};color:${o[3]}"><div style="font-size:14px;font-weight:700;letter-spacing:4px">NÍVEL FINAL</div><div style="font-size:40px;font-weight:700;margin-top:4px">${o[0]}</div><div style="font-size:18px;font-weight:600;margin-top:6px">${o[1]}</div></div>
  <table style="margin-top:18px;font-size:15px"><thead><tr><th>CONTEXTO ↓ / CORPO →</th><th>BAIXO</th><th>MÉDIO</th><th>ALTO</th></tr></thead><tbody>
  ${Object.keys(LV).map(c=>`<tr><th>${LV[c].toUpperCase()}</th>${Object.keys(LV).map(b=>`<td style="font-weight:${c===mxC&&b===mxB?700:500};background:${c===mxC&&b===mxB?'var(--roseSoft)':'transparent'}">${OUT[MATRIX[c][b]][0]}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{mxC=b.dataset.c;renderMatrix()});
  el.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{mxB=b.dataset.b;renderMatrix()});
}


/* ---------- Equipe ---------- */
let clearArm=false; let teamUnsub=null; let teamDay=state.day; let teamRows=[]; let onlyFull=false; let winner=null;
function openTeam(){
  teamDay=state.day; winner=null;
  $('#modalRoot').innerHTML=`<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true" aria-label="Área da equipe" id="md"></div></div>`;
  $('#ov').onclick=e=>{if(e.target.id==='ov')closeTeam()};
  subscribe(); renderTeam();
}
function closeTeam(){ if(teamUnsub)teamUnsub(); teamUnsub=null; $('#modalRoot').innerHTML='' }
function subscribe(){
  if(teamUnsub)teamUnsub(); teamRows=[];
  if(!db){renderTeam();return}
  teamUnsub=db.collection('participantes_'+teamDay).orderBy('criadoEm','desc').onSnapshot(s=>{teamRows=s.docs.map(d=>d.data());renderTeam()},e=>alertaEquipe('Não foi possível carregar a lista: '+(e&&e.message||'erro')));
}
function renderTeam(){
  const md=$('#md'); if(!md) return;
  const pool = teamRows.filter(r=>!onlyFull||r.acertos===r.total);
  md.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2 style="margin:0;font-size:30px">Área da equipe</h2><div style="display:flex;gap:10px"><button class="btn ghost" style="padding:10px 18px;min-height:48px;font-size:17px" id="sair">Sair</button><button class="btn ghost" style="padding:10px 18px;min-height:48px;font-size:17px" id="cl">Fechar</button></div></div>
  <div style="font-size:16px;font-weight:600;color:var(--muted);margin-top:18px">Quiz que aparece no tablet</div>
  <div class="daypick">${Object.keys(QUIZZES).map(d=>`<button data-d="${d}" aria-pressed="${state.day===d}">${DAY_LABEL[d]}</button>`).join('')}</div>
  <div style="font-size:16px;font-weight:600;color:var(--muted);margin-top:10px">Participantes de</div>
  <div class="daypick">${Object.keys(QUIZZES).map(d=>`<button data-t="${d}" aria-pressed="${teamDay===d}">${DAY_LABEL[d]}</button>`).join('')}</div>
  <p class="err" id="teamErr">${sb?'':'Sem conexão com o servidor agora. As participações ficam guardadas no tablet e são enviadas quando a internet voltar.'}${lerFila().length?' '+lerFila().length+' participação(ões) ainda aguardando envio.':''}</p>
  <label class="check" style="margin-top:6px"><input type="checkbox" id="full" ${onlyFull?'checked':''}> Sortear só entre quem acertou todas</label>
  <div style="display:flex;gap:14px;align-items:center;margin-top:18px;flex-wrap:wrap"><button class="btn rose" id="draw" ${pool.length?'':'disabled'}>Sortear agora</button><span style="font-size:18px;font-weight:600">${pool.length} ${pool.length===1?'pessoa concorrendo':'pessoas concorrendo'}</span></div>
  ${winner?`<div class="winner">Ganhador(a) de ${DAY_LABEL[teamDay]}<b>${esc(winner.nome)}</b>${esc(winner.telefone)} · ${winner.acertos}/${winner.total} acertos</div>`:''}
  <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:18px"><button class="btn ghost" style="padding:12px 20px;min-height:48px;font-size:17px" id="csv">Baixar lista (CSV)</button><button class="btn ghost" style="padding:12px 20px;min-height:48px;font-size:17px;color:var(--bad)" id="clr">${clearArm?'Toque de novo para apagar':'Apagar lista deste dia'}</button></div>
  <table><thead><tr><th>NOME</th><th>TELEFONE</th><th>ACERTOS</th><th>HORA</th></tr></thead><tbody>
  ${teamRows.map(r=>`<tr><td>${esc(r.nome)}</td><td>${esc(r.telefone)}</td><td>${r.acertos}/${r.total}</td><td>${new Date(r.criadoEm).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</td></tr>`).join('')||'<tr><td colspan="4" style="color:var(--muted)">Ninguém ainda.</td></tr>'}
  </tbody></table>`;
  $('#cl').onclick=closeTeam;
  $('#sair').onclick=async()=>{await lock();closeTeam()};
  $('#csv').onclick=()=>{const rows=[['dia','nome','telefone','acertos','total','data_hora']].concat(teamRows.map(r=>[teamDay,r.nome,r.telefone,r.acertos,r.total,new Date(r.criadoEm).toLocaleString('pt-BR')]));
    const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='participantes-'+teamDay+'.csv'; document.body.appendChild(a); a.click(); a.remove();};
  $('#clr').onclick=()=>{ if(!clearArm){clearArm=true;renderTeam();setTimeout(()=>{clearArm=false;renderTeam()},4000);return} clearArm=false; if(db)db.clear('participantes_'+teamDay); winner=null; };
  md.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{state.day=b.dataset.d;try{localStorage.setItem('ampara-quiz-dia',state.day)}catch(e){};Object.assign(state,{step:'start'});render();renderTeam()});
  md.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{teamDay=b.dataset.t;winner=null;subscribe();renderTeam()});
  $('#full').onchange=e=>{onlyFull=e.target.checked;winner=null;renderTeam()};
  $('#draw').onclick=()=>{ if(!pool.length)return; const a=new Uint32Array(1);crypto.getRandomValues(a); winner=pool[a[0]%pool.length]; renderTeam() };
}

/* ---------- Login da equipe (usuário e senha padrão, conferidos no Supabase) ---------- */
const CRED='ampara_equipe_cred';
function credenciais(){ try{ const c=JSON.parse(sessionStorage.getItem(CRED)||'null'); if(c&&c.ate>Date.now()) return c; sessionStorage.removeItem(CRED) }catch(e){} return null }
async function isUnlocked(){ return !!credenciais() }
async function lock(){ try{ sessionStorage.removeItem(CRED) }catch(e){} }
function openLogin(){
  $('#modalRoot').innerHTML=`<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true" aria-label="Login da equipe" style="max-width:520px">
   <div class="kick">ÁREA DA EQUIPE</div><h2 style="font-size:34px;margin-top:8px">Entrar</h2>
   <form id="lf" autocomplete="off" style="margin-top:20px">
    <label class="f">Usuário<input type="text" id="lu" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
    <label class="f">Senha<input type="password" id="lp" required></label>
    <div class="err" id="le">${sb?'':'Sem conexão com o servidor. Verifique a internet.'}</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" type="submit" id="lb">Entrar</button><button class="btn ghost" type="button" id="lc">Cancelar</button></div>
   </form></div></div>`;
  $('#ov').onclick=e=>{if(e.target.id==='ov')$('#modalRoot').innerHTML=''};
  $('#lc').onclick=()=>{$('#modalRoot').innerHTML=''};
  setTimeout(()=>$('#lu').focus(),50);
  $('#lf').onsubmit=async ev=>{ev.preventDefault(); if(!sb) return;
    const le=$('#le'), lb=$('#lb'); lb.disabled=true; lb.textContent='Entrando...'; le.textContent='';
    const u=$('#lu').value.trim().toLowerCase(), pw=$('#lp').value;
    const {data,error}=await sb.rpc('eureka_login',{p_usuario:u,p_senha:pw});
    lb.disabled=false; lb.textContent='Entrar';
    if(error){ le.textContent='Não foi possível conferir agora ('+(error.message||'erro')+').'; return }
    if(data!==true){ le.textContent='Usuário ou senha incorretos.'; $('#lp').value=''; return }
    try{ sessionStorage.setItem(CRED,JSON.stringify({u,p:pw,ate:Date.now()+15*60*1000})) }catch(e){}
    esvaziarFila(); openTeam() };
}
$('#teamBtn').onclick=async()=>{ if(await isUnlocked()) openTeam(); else openLogin(); };

$('#tab-score').onclick=()=>{state.tab='score';render()};
render();
</script>

</body></html>
