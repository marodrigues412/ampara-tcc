<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="/favicon-ampara.png">
<link rel="apple-touch-icon" href="/favicon-ampara.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Ampara · Apresentação</title>
<style>
html,body{margin:0;height:100%;background:#1B2A55;overflow:hidden;-webkit-tap-highlight-color:transparent;font-family:system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.sl{position:absolute;max-width:100vw;max-height:100vh;width:100vw;height:56.25vw;object-fit:contain;opacity:0;transition:opacity .9s ease}
@media (min-aspect-ratio:16/9){.sl{height:100vh;width:177.78vh}}
.sl.on{opacity:1}
#bar{position:fixed;left:0;bottom:0;height:4px;background:#E9C6CC;width:0}
#hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(20,32,63,.85);color:#F4EEE4;font-size:15px;padding:10px 16px;border-radius:999px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#fs{position:fixed;right:14px;top:14px;border:0;background:rgba(20,32,63,.6);color:#F4EEE4;font-size:14px;padding:10px 14px;border-radius:12px;min-height:44px;opacity:.0;transition:opacity .4s}
body.ui #fs,body.ui #hint{opacity:1}
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar"></div>
<div id="hint">Toque na direita para avançar, na esquerda para voltar · segure para pausar</div>
<button id="fs" type="button">Tela cheia</button>
<script>
const N=11, TEMPO=8000; // 8 s por slide, em loop
const stage=document.getElementById('stage'), bar=document.getElementById('bar');
const imgs=[];
for(let i=1;i<=N;i++){const im=new Image();im.className='sl';im.alt='Slide '+i;im.src='/eureka/apresentacao/slides/'+String(i).padStart(2,'0')+'.jpg';stage.appendChild(im);imgs.push(im)}
let cur=0, inicio=performance.now(), pausado=false, tempoPausado=0;
function mostrar(i){imgs[cur].classList.remove('on');cur=(i+N)%N;imgs[cur].classList.add('on');inicio=performance.now();tempoPausado=0}
imgs[0].classList.add('on');
function tick(t){ if(!pausado){const p=(t-inicio)/TEMPO; bar.style.width=Math.min(100,p*100)+'%'; if(p>=1) mostrar(cur+1)} else {inicio=t-tempoPausado} requestAnimationFrame(tick)}
requestAnimationFrame(tick);
let uiT; function ui(){document.body.classList.add('ui');clearTimeout(uiT);uiT=setTimeout(()=>document.body.classList.remove('ui'),2500)}
let segurar;
stage.addEventListener('pointerdown',e=>{segurar=setTimeout(()=>{pausado=true;tempoPausado=performance.now()-inicio;ui()},500)});
stage.addEventListener('pointerup',e=>{clearTimeout(segurar); if(pausado){pausado=false;return} ui(); mostrar(e.clientX>innerWidth/2?cur+1:cur-1)});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')mostrar(cur+1);if(e.key==='ArrowLeft')mostrar(cur-1)});
document.getElementById('fs').onclick=()=>{const d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d)};
// Mantém a tela acesa onde o navegador permitir
async function acordado(){try{if('wakeLock' in navigator){await navigator.wakeLock.request('screen')}}catch(e){}}
acordado(); document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')acordado()});
ui();
</script>
</body>
</html>
