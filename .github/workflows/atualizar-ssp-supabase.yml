name: Atualizar dados SSP-SP no Supabase

on:
  workflow_dispatch:
  schedule:
    # 07:00 no horário de Brasília.
    - cron: "0 10 * * *"

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: python -m pip install -r data-processing/requirements.txt

      - name: Importar meses novos da SSP-SP
        env:
          SUPABASE_DB_HOST: aws-1-us-east-2.pooler.supabase.com
          SUPABASE_DB_PORT: "5432"
          SUPABASE_DB_NAME: postgres
          SUPABASE_DB_USER: postgres.hhlxgtwvoxpvyvejvxwt
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_SSLMODE: require
        run: python data-processing/importar_ssp_supabase.py --anos "$(date +%Y)"
